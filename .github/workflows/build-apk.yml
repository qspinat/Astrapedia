name: Build APK

# Debug APK on every push and pull request, downloadable from the run's
# Artifacts section. A signed release build is opt-in — see the release job.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight build irrelevant.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: JavaScript tests
        run: npm test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Python tests
        run: uv run pytest tests/python -q

  build:
    name: Debug APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Capacitor's Android platform requires Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      # build:web copies only the four JSON files the app fetches, all of
      # which are committed. The large star catalogs and the raw HYG/NGC CSVs
      # are build outputs of data_pipeline.py and are untracked, so CI never
      # needs to run the pipeline. A clean debug APK is ~6.4 MB; before that
      # copy list was made explicit it was ~33 MB, most of it catalogs the app
      # never reads.
      - name: Build web assets and APK
        run: npm run build:android

      - name: Report APK size
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh "$apk"
          echo "### Debug APK" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Size | $(du -h "$apk" | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${GITHUB_SHA::7}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Web bundle | $(du -sh www | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: astrapedia-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Signed release bundle
    needs: test
    # Tags only, and only when the signing secrets are configured. Without
    # them app/build.gradle silently produces an unsigned build, which is not
    # worth publishing — so skip rather than emit something unusable.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for signing secrets
        id: secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "ANDROID_KEYSTORE_BASE64 is not set; skipping the signed build." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.present == 'true'
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        if: steps.secrets.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.secrets.outputs.present == 'true'

      - run: npm ci
        if: steps.secrets.outputs.present == 'true'

      # app/build.gradle reads android/keystore.properties when it exists and
      # falls back to an unsigned build when it does not, so the secrets are
      # written into that shape. The runner is ephemeral, but remove it anyway
      # so a later step in this job cannot read the key material.
      - name: Write signing config
        if: steps.secrets.outputs.present == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/release.jks
          cat > android/keystore.properties <<EOF
          storeFile=release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release bundle
        if: steps.secrets.outputs.present == 'true'
        run: npm run build:android:release

      - name: Remove signing material
        if: always() && steps.secrets.outputs.present == 'true'
        run: rm -f android/release.jks android/keystore.properties

      - name: Upload AAB
        if: steps.secrets.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: astrapedia-release-${{ github.ref_name }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90
