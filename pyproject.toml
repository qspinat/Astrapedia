[project]
name = "skymap"
version = "0.1.0"
description = "Interactive 3D celestial sphere application for learning astronomical coordinates"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Skymap Contributors" }
]
keywords = ["astronomy", "celestial", "visualization", "three.js", "astropy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "astropy>=5.0",
    "pandas>=1.3.0",
    "numpy>=1.21.0",
    "jplephem>=2.17",
]

[project.urls]
Homepage = "https://github.com/yourusername/skymap"
Repository = "https://github.com/yourusername/skymap"

[project.scripts]
skymap-pipeline = "data_pipeline:main"
skymap-transform = "coordinate_transform:main"
skymap-optimize = "create_optimized_data:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v"
